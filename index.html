<title>Ten Doors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a snowy meadow valley in soft daylight. A painted-style scenery banner (hills, pines with
   lights, a cottage, a stream, wildflowers) opens the page, then a left-aligned title with the live
   countdown, then 10 ribboned gift-box doors in two rows of five. Opening a door lifts a paper card
   over the scene. One committed look: sky blue, meadow green, cranberry, gold. */
:root {
  --sky-top: #a9d3e6;
  --sky-low: #e7f3ec;
  --meadow: #4f9a6c;
  --moss: #3f8660;
  --lake: #3f83a8;
  --cranberry: #b23a48;
  --cranberry-deep: #9a2f3d;
  --gold: #e8b64c;
  --butter: #ffe9b0;
  --snow: #ffffff;
  --paper: #fbfdfb;
  --ink: #17403f;
  --ink-soft: #3d6663;
  --font-display: "Mountains of Christmas", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--sky-low);
  background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-low) 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 1.25rem 2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.page { position: relative; z-index: 1; max-width: 62rem; margin: 0 auto; }

.scene { display: block; width: 100%; height: auto; border-radius: 18px; box-shadow: 0 10px 24px rgba(23, 64, 63, 0.18); }
header { display: grid; gap: 0.5rem; margin: 1.25rem 0 1.75rem; }
.eyebrow { margin: 0; color: var(--cranberry-deep); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.7rem, 10vw, 4.8rem);
  line-height: 1;
  text-wrap: balance;
  color: var(--ink);
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.6);
}
.status { margin: 0.25rem 0 0; color: var(--ink-soft); font-size: 1.05rem; max-width: 40rem; }
.hint { margin: 0.25rem 0 0; min-height: 1.5em; color: var(--cranberry-deep); font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; max-width: 44rem; }
@media (min-width: 720px) { .grid { gap: 16px; } }

.door {
  --box: var(--cranberry-deep);
  --ribbon: var(--butter);
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 12px;
  background: var(--box);
  color: var(--snow);
  cursor: pointer;
  overflow: hidden;
  font-family: var(--font-display);
  box-shadow: 0 6px 12px rgba(23, 64, 63, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
  transition: transform 0.15s ease, filter 0.2s ease, opacity 0.2s ease;
}
.door[data-tone="1"] { --box: var(--moss); --ribbon: #ffffff; }
.door[data-tone="2"] { --box: var(--lake); --ribbon: var(--butter); }
.door::before, .door::after { content: ""; position: absolute; background: var(--ribbon); opacity: 0.95; }
.door::before { left: calc(50% - 5px); width: 10px; top: 0; bottom: 0; }
.door::after { top: calc(50% - 5px); height: 10px; left: 0; right: 0; }
.door:hover { transform: translateY(-3px); }
.door:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.num { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; font-size: clamp(1.05rem, 4.6vw, 1.7rem); }
.num span {
  display: grid; place-items: center;
  width: 2.3em; height: 2.3em; border-radius: 50%;
  background: var(--box);
  box-shadow: 0 0 0 3px var(--ribbon);
  line-height: 1;
}
.sub { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; z-index: 2; font-family: var(--font-body); }
.sub span {
  background: var(--box);
  padding: 1px 6px;
  border-radius: 99px;
  font-weight: 800;
  font-size: 0.6rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.door.locked { filter: saturate(0.35); opacity: 0.72; }
.door.locked:hover { transform: none; }
.door.today { box-shadow: 0 0 0 3px var(--gold), 0 0 26px rgba(232, 182, 76, 0.7); animation: glow 2.4s ease-in-out infinite; }
.door.shake { animation: shake 0.35s ease; }
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 3px var(--gold), 0 0 14px rgba(232, 182, 76, 0.45); }
  50% { box-shadow: 0 0 0 3px var(--gold), 0 0 30px rgba(232, 182, 76, 0.85); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

footer { margin: 2rem 0 1.25rem; display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; color: var(--ink-soft); font-size: 0.9rem; }
.link-btn { background: none; border: 0; padding: 0; color: var(--cranberry-deep); font: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

.overlay {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center;
  background: rgba(18, 53, 58, 0.62);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: min(34rem, 100%);
  max-height: 100%;
  overflow: auto;
  background: var(--paper);
  color: var(--ink);
  border-radius: 16px;
  border-top: 8px solid var(--moss);
  padding: 1.25rem 1.5rem 1.25rem;
  box-shadow: 0 20px 50px rgba(18, 53, 58, 0.45);
  outline: none;
}
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
.pill { background: var(--cranberry-deep); color: var(--snow); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; }
.card-num { color: var(--ink-soft); font-weight: 700; font-size: 0.9rem; }
.card h2 { margin: 0 0 0.75rem; font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 2.3rem); line-height: 1.1; text-wrap: balance; }
.card-body { margin: 0; font-size: 1.05rem; line-height: 1.65; white-space: pre-line; max-width: 65ch; }
.bonus { margin-top: 1.25rem; padding-top: 1rem; border-top: 2px dashed rgba(23, 64, 63, 0.25); }
.bonus-out { margin: 0.75rem 0 0; font-style: italic; line-height: 1.6; white-space: pre-line; }
.btn { font: inherit; font-weight: 800; border: 0; border-radius: 10px; padding: 0.6rem 1rem; cursor: pointer; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.primary { background: var(--cranberry-deep); color: var(--snow); }
.btn.primary:disabled { opacity: 0.6; cursor: default; }
.btn.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(23, 64, 63, 0.3); }
.card-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: space-between; margin-top: 1.25rem; }

.keepsakes { margin-top: 2.25rem; max-width: 44rem; }
.keepsakes h2 { margin: 0 0 1.1rem; font-family: var(--font-display); font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.1; color: var(--ink); }
.polaroids { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 3vw, 18px); align-items: start; }
.polaroid {
  position: relative;
  margin: 0;
  background: #ffffff;
  padding: 8px 8px 32px;
  border-radius: 4px;
  box-shadow: 0 10px 22px rgba(23, 64, 63, 0.25);
  transform: rotate(-2deg);
}
.polaroid:nth-child(2) { transform: rotate(1.8deg); margin-top: 14px; }
.polaroid:nth-child(3) { transform: rotate(-1.2deg); margin-top: 6px; }
.polaroid.no-cap { padding-bottom: 8px; }
.polaroid::before {
  content: "";
  position: absolute; top: -10px; left: 50%;
  width: 64px; height: 20px;
  transform: translateX(-50%) rotate(-3deg);
  background: rgba(232, 182, 76, 0.6);
}
.polaroid img { display: block; width: 100%; height: auto; border-radius: 2px; }
.polaroid figcaption { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-family: var(--font-display); font-size: clamp(0.85rem, 2.8vw, 1.1rem); color: var(--ink-soft); }

.music-btn {
  position: fixed; z-index: 10;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: inherit; font-weight: 800; font-size: 0.9rem;
  border: 0; border-radius: 99px; padding: 0.6rem 1.1rem;
  background: var(--cranberry-deep); color: var(--snow);
  box-shadow: 0 6px 16px rgba(23, 64, 63, 0.35);
  cursor: pointer;
  text-decoration: none;
  line-height: 1.4;
}
.music-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .door, .door.today, .door.shake { animation: none; transition: none; }
}
</style>

  // Change these lines to personalize everything.
  var CONFIG = {

    you: "Koushik",             // your name
    year: 2026,                 // the year the doors open
    startDay: 16,               // December day that door 1 opens; door 10 then opens on Christmas Day

  // t = label on the card, s = short label on the door, nb = hide the bonus-surprise button

    { t: "Letter", s: "Letter", h: "A Letter from Santa", x: "Dear {HER},\n\nI have checked my list twice, and your name is at the very top, written in gold ink.\n\nThe elves report a whole year of kindness, terrible puns tolerated, and at least a few moments of pure magic. I am pleased to make it official.\n\nOFFICIAL NICE LIST CERTIFICATE\nThis certifies that {HER} is a Gold-Level member of the Nice List for the entire year.\n\n{YOU} has hidden ten doors for you, one a day, all the way to Christmas. Open them in order and no peeking ahead.\n\nWith jingle bells and best wishes,\nS. Claus\n\nP.S. {YOU} asked me to pass along a message: no matter how many miles are between you, he is thinking of you every single day." },

    { t: "Joke", s: "Joke", h: "Breakfast at the North Pole", x: "What do snowmen eat for breakfast?\n\nFrosted flakes." },
    { t: "Voice note", s: "Voice", nb: true, h: "A Voice Note from {YOU}", x: "Today's door is a voice note from {YOU}.\n\nIt is on its way to you, so check your messages and press play somewhere quiet. Headphones recommended." },
    { t: "Story", s: "Story", h: "The Snowman Who Moved Indoors", x: "One year a very confident snowman moved into a living room. He lasted about eleven minutes.\n\nBut in those eleven minutes he wore a scarf, ate half a carrot, and had the best time of his life.\n\nThe moral: some things are worth doing even if they melt. Especially if someone is laughing nearby." },
    { t: "Joke", s: "Joke", h: "Detective Santa", x: "What do you get when you cross Santa with a detective?\n\nSanta Clues." },

  ];

  function fill(s) {
    return s.split("{HER}").join(CONFIG.her).split("{YOU}").join(CONFIG.you);
  }

  function openDate(n) { return new Date(CONFIG.year, 11, CONFIG.startDay + n - 1); }
  function dayLabel(n) { return "Dec " + (CONFIG.startDay + n - 1); }

  var seen = new Set();
  try { JSON.parse(localStorage.getItem("fd-seen-10") || "[]").forEach(function (n) { seen.add(n); }); } catch (e) {}
  function saveSeen() { try { localStorage.setItem("fd-seen-10", JSON.stringify(Array.from(seen))); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), hint = $("hint"), overlay = $("overlay"), card = $("card");
  var current = 0, sampleFn = null, busy = false, renderedDay = "";

  function isPreview() { return false; }

  function statusLine(now) {
    if (isPreview()) return "Preview mode: every door is unlocked so you can look around.";
    var first = openDate(1), last = openDate(DOORS.length);
    if (now < first) {
      var d = Math.ceil((first - now) / 864e5);
      return "The first door opens on December " + CONFIG.startDay + ". " + d + (d === 1 ? " day" : " days") + " to go.";
    }
    if (now >= last) return "Merry Christmas, " + CONFIG.her + ". Every door is open.";
    var k = now.getDate() - CONFIG.startDay + 1;
    var left = Math.ceil((last - now) / 864e5);
    return "Door " + k + " is open today. " + left + (left === 1 ? " day" : " days") + " until Christmas.";
  }

  function render() {
    var now = new Date(), preview = isPreview();
    renderedDay = now.toDateString() + preview;
    $("eyebrow").textContent = "Christmas Calendar for my beautiful girlfriend Adele";
    $("status").textContent = statusLine(now);
    $("rule").textContent = "One door opens each day from December " + CONFIG.startDay + " until Christmas Day.";
    var todayN = 0;
    if (now.getFullYear() === CONFIG.year && now.getMonth() === 11) {
      var k = now.getDate() - CONFIG.startDay + 1;
      if (k >= 1 && k <= DOORS.length) todayN = k;
    }
    grid.textContent = "";
    DOORS.forEach(function (d, i) {
      var n = i + 1;
      var open = preview || now >= openDate(n);
      var isSeen = open && seen.has(n);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "door" + (open ? "" : " locked") + (n === todayN && !preview ? " today" : "");
      b.dataset.tone = String(i % 3);
      b.dataset.n = String(n);
      b.setAttribute("aria-label", "Door " + n + (open ? (isSeen ? ", opened" : ", ready to open") : ", opens December " + (CONFIG.startDay + n - 1)));
      var num = document.createElement("div");
      num.className = "num";
      var ns = document.createElement("span");
      ns.textContent = String(n);
      num.appendChild(ns);
      var sub = document.createElement("div");
      sub.className = "sub";
      var ss = document.createElement("span");
      ss.textContent = open ? (isSeen ? d.s : "Open") : dayLabel(n);
      sub.appendChild(ss);
      b.appendChild(num);
      b.appendChild(sub);
      b.addEventListener("click", function () {
        if (open) { reveal(n); return; }
        hint.textContent = "Door " + n + " opens on December " + (CONFIG.startDay + n - 1) + " 👀👀👀 wait up sugar";
        b.classList.remove("shake");
        void b.offsetWidth;
        b.classList.add("shake");
      });
      grid.appendChild(b);
    });
  }

  function reveal(n) {
    var d = DOORS[n - 1];
    current = n;
    $("cardType").textContent = d.t;
    $("cardNum").textContent = "Door " + n + " of " + DOORS.length;
    $("cardTitle").textContent = fill(d.h);
    $("cardBody").textContent = fill(d.x);
    $("bonusOut").textContent = "";
    $("bonusOut").hidden = true;
    $("bonus").hidden = !sampleFn || !!d.nb;
    $("bonusBtn").disabled = false;
    $("bonusBtn").textContent = "Ask Santa for a bonus surprise";
    hint.textContent = "";
    overlay.hidden = false;
    card.scrollTop = 0;
    card.focus();
    seen.add(n);
    saveSeen();
  }

  function closeCard() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    render();
    var b = grid.querySelector('[data-n="' + current + '"]');
    if (b) b.focus();
  }

  $("closeBtn").addEventListener("click", closeCard);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeCard(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCard(); });


  // Optional live AI surprise. Appears only when the viewer can ask Claude.
  if (window.claude && window.claude.use) {
    window.claude.use("sample").then(function (s) { sampleFn = s || null; }).catch(function () {});
  }

  $("bonusBtn").addEventListener("click", async function () {
    if (!sampleFn || busy) return;
    var d = DOORS[current - 1];
    var btn = $("bonusBtn"), out = $("bonusOut");
    busy = true;
    btn.disabled = true;
    out.hidden = false;
    out.textContent = "The elves are writing…";
    var extra = CONFIG.insideJokes.length ? " If it fits naturally, you may nod to one of these shared jokes: " + CONFIG.insideJokes.join("; ") + "." : "";
    var prompt = "You are the head elf at the North Pole, writing a tiny surprise for " + CONFIG.her +
      ", from " + CONFIG.you + ". They are in a long-distance relationship, so when it fits, lean into missing each other and being together in spirit. " +
      "It goes inside door " + current + " of a ten-door Christmas calendar. " +
      "The door's theme is: " + d.t + " (" + fill(d.h) + "). Write 2 to 4 warm, playful sentences in plain text. " +
      "No markdown, no emoji, no preamble. Make it fresh and specific, and do not repeat this existing text: " + fill(d.x) + extra;
    try {
      var r = await sampleFn(prompt, { cache: false, onText: function (e) { out.textContent = e.text; } });
      if (r && r.text) out.textContent = r.text.trim();
      btn.textContent = "Another one";
    } catch (err) {
      if (err && err.code === "not_granted") {
        $("bonus").hidden = true;
        sampleFn = null;
      } else {
        out.textContent = "The elves are busy right now. Try again in a minute.";
      }
    } finally {
      busy = false;
      btn.disabled = false;
    }
  });

  // Snow
  var cv = $("snow"), cx = cv.getContext("2d"), flakes = [], W = 0, H = 0;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sizeSnow() {
    var r = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * r; cv.height = H * r;
    cx.setTransform(r, 0, 0, r, 0, 0);
    flakes = [];
    var count = Math.round(Math.min(90, (W * H) / 14000));
    for (var i = 0; i < count; i++) {
      flakes.push({ x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.2, v: 0.3 + Math.random() * 0.8, d: Math.random() * 6.28, s: 0.3 + Math.random() * 0.6 });
    }
    if (reduce) drawSnow();
  }
  function drawSnow() {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = "rgba(255, 255, 255, 0.95)";
    cx.shadowColor = "rgba(70, 130, 160, 0.45)";
    cx.shadowBlur = 3;
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      if (!reduce) {
        f.y += f.v; f.d += 0.01; f.x += Math.sin(f.d) * f.s;
        if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
      }
      cx.beginPath();
      cx.arc(f.x, f.y, f.r, 0, 6.283);
      cx.fill();
    }
    if (!reduce) requestAnimationFrame(drawSnow);
  }
  window.addEventListener("resize", sizeSnow);
  sizeSnow();
  if (!reduce) requestAnimationFrame(drawSnow);

  render();
  setInterval(function () {
    if (overlay.hidden && renderedDay !== new Date().toDateString() + isPreview()) render();
  }, 60000);
})();
</script>

</body></html>
